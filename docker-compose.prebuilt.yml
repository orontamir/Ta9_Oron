# Override for restricted networks: package host-published binaries instead of building inside Docker.
#   ./scripts/docker-up-prebuilt.ps1
# (= dotnet publish to ./artifacts, the UI from ui/prebuilt, then: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up --build)

services:
  job-service:
    build:
      dockerfile: Dockerfile.prebuilt
  processor-service:
    build:
      dockerfile: Dockerfile.prebuilt
  audit-service:
    build:
      dockerfile: Dockerfile.prebuilt
  ui:
    build:
      dockerfile: Dockerfile.prebuilt   # packages the committed ui/prebuilt (no npm needed)
