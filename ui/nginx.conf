# Serves the Angular app and forwards the REST calls, so the browser talks to one origin (no CORS).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # A job may carry up to ~10 MB of documents.
    client_max_body_size 11m;

    location /api/jobs {
        proxy_pass http://job-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events (/api/jobs/{id}/events): stream immediately, keep the connection open.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/audit {
        proxy_pass http://audit-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routes (/jobs, /jobs/new, /jobs/{id}) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
